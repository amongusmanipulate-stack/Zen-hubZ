<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zen AI Hub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div id="sidebarOverlay" class="overlay hidden"></div>
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>Chats</h3>
            <button id="closeSidebar" class="icon-btn"><i class="fas fa-times"></i></button>
        </div>
        <button id="newChatBtn" class="new-chat-btn"><i class="fas fa-plus"></i> New Conversation</button>
        <div class="search-box">
            <input type="text" id="searchHistory" placeholder="Search chats...">
        </div>
        <div id="historyList" class="history-list"></div>
    </div>

    <div class="main-container">
        <header class="top-bar">
            <button id="openSidebar" class="icon-btn"><i class="fas fa-bars"></i></button>
            <h2 class="title">Zen AI</h2>
        </header>

        <div id="chatArea" class="chat-area">
            <div id="welcomeScreen" class="welcome-screen">
                <h1>How can I help you today?</h1>
                <div class="suggestions">
                    <button class="suggestion-btn">Write a Python script</button>
                    <button class="suggestion-btn">Explain Smali code</button>
                </div>
            </div>
        </div>

        <div class="input-container">
            <div id="imagePreviewContainer" class="image-preview-hidden">
                <img id="imagePreview" src="" alt="Preview">
                <button id="removeImage"><i class="fas fa-times"></i></button>
                <span id="fileName"></span>
            </div>
            
            <div class="input-box">
                <div class="dropdown">
                    <button id="plusBtn" class="icon-btn"><i class="fas fa-plus"></i></button>
                    <div id="attachMenu" class="dropdown-content hidden">
                        <label for="imageUpload"><i class="fas fa-image"></i> Gallery</label>
                        <input type="file" id="imageUpload" accept="image/*" hidden>
                    </div>
                </div>
                <textarea id="userInput" placeholder="Type your message..." rows="1"></textarea>
                <button id="sendBtn" class="icon-btn send-btn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
